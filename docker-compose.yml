services:
  healthd:
    build: .

    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    stop_grace_period: 10s
